[project]
name = "apiverve-worldholidays"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "World Holidays lists public holidays and observances for any two-letter country code. It returns holiday dates, official names, and event types across the year."
keywords = ["world holidays api", "public holiday calendar", "get holidays by country", "national holidays by country code", "global holiday schedule"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/worldholidays?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/worldholidays?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/worldholidays-api"
Twitter = "https://twitter.com/apivervehq"
