openapi: 3.0.4
info:
  title: World Holidays
  description: >-
    World Holidays lists public holidays and observances for any two-letter
    country code, optionally for a state or region. It returns holiday dates,
    local and English names, day of week, event types and substitute-day flags,
    and can check whether a single date is a holiday.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/worldholidays:
    get:
      summary: World Holidays
      description: >-
        Get the holidays of a country, or one of its regions, for a given year,
        optionally filtered by type or checked for a single date
      operationId: worldholidays
      parameters:
        - name: country
          in: query
          schema:
            type: string
          required: true
          description: The 2-letter country code for which you want to get the holidays
          example: US
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: The year for which you want to get the holidays
          example: 2026
        - name: region
          in: query
          schema:
            type: string
          required: false
          description: >-
            State or region code (e.g. BY, CA or US-CA) to include regional
            holidays
          example: CA
        - name: type
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only return these holiday types, comma-separated: public, bank,
            school, optional, observance
          example: public
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Check a single date (YYYY-MM-DD); returns isHoliday and only the
            holidays on that day. Overrides year
          example: '2026-07-03'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: US
                  year: 2026
                  holidays:
                    - date: '2026-01-01 00:00:00'
                      start: '2026-01-01T05:00:00.000Z'
                      end: '2026-01-02T05:00:00.000Z'
                      name: New Year's Day
                      type: public
                      dayOfWeek: Thursday
                      englishName: New Year's Day
                    - date: '2026-01-19 00:00:00'
                      start: '2026-01-19T05:00:00.000Z'
                      end: '2026-01-20T05:00:00.000Z'
                      name: Martin Luther King Jr. Day
                      type: public
                      dayOfWeek: Monday
                      englishName: Martin Luther King Jr. Day
                    - date: '2026-02-14 00:00:00'
                      start: '2026-02-14T05:00:00.000Z'
                      end: '2026-02-15T05:00:00.000Z'
                      name: Valentine's Day
                      type: observance
                      dayOfWeek: Saturday
                      englishName: Valentine's Day
                    - date: '2026-02-16 00:00:00'
                      start: '2026-02-16T05:00:00.000Z'
                      end: '2026-02-17T05:00:00.000Z'
                      name: Washington's Birthday
                      type: public
                      dayOfWeek: Monday
                      englishName: Washington's Birthday
                    - date: '2026-03-17 00:00:00'
                      start: '2026-03-17T04:00:00.000Z'
                      end: '2026-03-18T04:00:00.000Z'
                      name: St. Patrick's Day
                      type: observance
                      dayOfWeek: Tuesday
                      englishName: St. Patrick's Day
                    - date: '2026-04-05 00:00:00'
                      start: '2026-04-05T04:00:00.000Z'
                      end: '2026-04-06T04:00:00.000Z'
                      name: Easter Sunday
                      type: observance
                      dayOfWeek: Sunday
                      englishName: Easter Sunday
                    - date: '2026-04-15 00:00:00'
                      start: '2026-04-15T04:00:00.000Z'
                      end: '2026-04-16T04:00:00.000Z'
                      name: Tax Day
                      type: observance
                      dayOfWeek: Wednesday
                      englishName: Tax Day
                    - date: '2026-04-22 00:00:00'
